name: Build unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-ipa.yml"
      - "Scripts/**"
      - "TokyoRevengersFighting/**"
      - "TokyoRevengersFighting.xcodeproj/**"

permissions:
  contents: read

jobs:
  ipa:
    name: Unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version && xcodebuild -showsdks

      - name: Build unsigned IPA
        run: |
          chmod +x Scripts/build_unsigned_ipa.sh
          ./Scripts/build_unsigned_ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TokyoRevengersFighting-unsigned
          path: build/TokyoRevengersFighting_unsigned.ipa
          if-no-files-found: error
          retention-days: 14
